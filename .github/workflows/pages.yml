# Publica la carpeta public/ en GitHub Pages cada vez que se sube un cambio a main.
# La app funciona sin el servidor Node: Gemini y Azure se llaman directo desde el navegador.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Cada publicación lleva su propia versión (?v=...) para que el navegador no use archivos viejos
      - name: Poner versión a los archivos
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
